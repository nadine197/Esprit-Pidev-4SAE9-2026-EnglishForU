<div class="py-10">
  <div class="container mx-auto px-4 max-w-2xl">
    <button (click)="goBack()" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-[#0066FF] mb-6 bg-transparent border-none cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-8">
      <h1 class="text-2xl font-bold text-slate-900 mb-6">{{ isEditMode ? 'Edit Event' : 'Create New Event' }}</h1>

      <div *ngIf="loading" class="flex justify-center py-10">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#0066FF]"></div>
      </div>

      <form *ngIf="!loading" [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Event Title</label>
          <input formControlName="title" type="text" placeholder="Enter event title"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0066FF]/20 focus:border-[#0066FF]"/>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Description</label>
          <textarea formControlName="description" rows="4" placeholder="Describe the event..."
            class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0066FF]/20 focus:border-[#0066FF] resize-none"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Date & Time</label>
            <input formControlName="eventDate" type="datetime-local"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0066FF]/20 focus:border-[#0066FF]"/>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Location Name</label>
            <input formControlName="location" type="text" placeholder="Room 302, Campus..."
              class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0066FF]/20 focus:border-[#0066FF]"/>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">
            📍 Select Location on Map
            <span class="text-xs text-slate-400 font-normal ml-1">(click anywhere to pin the venue)</span>
          </label>
          <div id="eventMap" class="w-full rounded-xl border border-slate-200 overflow-hidden" style="height: 320px; z-index: 0;"></div>
          <p *ngIf="selectedLocationName" class="text-xs text-green-600 mt-1 font-medium">
            📌 {{ selectedLocationName }}
          </p>
          <p *ngIf="selectedLat && selectedLng" class="text-xs text-slate-400 mt-0.5">
            Coordinates: {{ selectedLat | number:'1.5-5' }}, {{ selectedLng | number:'1.5-5' }}
          </p>
        </div>

        <div class="bg-slate-50 rounded-xl p-5 space-y-4">
          <div class="flex items-center justify-between">
            <label class="text-sm font-semibold text-slate-700">Registration Type</label>
            <div class="flex gap-2">
              <button type="button"
                (click)="eventForm.patchValue({paid: false, price: null})"
                [class]="!isPaid ? 'bg-[#0066FF] text-white' : 'bg-white text-slate-600 border border-slate-200'"
                class="px-4 py-2 rounded-lg text-xs font-bold transition-all">
                🆓 Free
              </button>
              <button type="button"
                (click)="eventForm.patchValue({paid: true})"
                [class]="isPaid ? 'bg-emerald-600 text-white' : 'bg-white text-slate-600 border border-slate-200'"
                class="px-4 py-2 rounded-lg text-xs font-bold transition-all">
                💳 Paid
              </button>
            </div>
          </div>

          <div *ngIf="isPaid">
            <label class="block text-sm font-semibold text-slate-700 mb-2">Ticket Price (TND)</label>
            <input formControlName="price" type="number" min="0.5" step="0.5" placeholder="e.g. 10.00"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500"/>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">
              Max Participants
              <span class="text-xs text-slate-400 font-normal ml-1">(leave blank for unlimited)</span>
            </label>
            <input formControlName="maxParticipants" type="number" min="1" step="1" placeholder="e.g. 50"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0066FF]/20 focus:border-[#0066FF]"/>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Event Image (optional)</label>
          <div class="flex gap-2 mb-3">
            <button type="button" (click)="imageMode='url'"
              [class]="imageMode==='url' ? 'bg-[#0066FF] text-white' : 'bg-slate-100 text-slate-600'"
              class="px-4 py-2 rounded-lg text-xs font-semibold transition-all">Paste URL</button>
            <button type="button" (click)="imageMode='upload'"
              [class]="imageMode==='upload' ? 'bg-[#0066FF] text-white' : 'bg-slate-100 text-slate-600'"
              class="px-4 py-2 rounded-lg text-xs font-semibold transition-all">Upload Image</button>
          </div>
          <input *ngIf="imageMode==='url'" formControlName="imageUrl" type="text"
            placeholder="https://example.com/event-image.jpg"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0066FF]/20 focus:border-[#0066FF]"/>
          <div *ngIf="imageMode==='upload'" class="relative">
            <input type="file" accept="image/*" (change)="onFileSelected($event)" class="hidden" #fileInput/>
            <button type="button" (click)="fileInput.click()" [disabled]="uploading"
              class="w-full px-4 py-6 rounded-xl border-2 border-dashed border-slate-300 hover:border-[#0066FF] text-sm text-slate-500 hover:text-[#0066FF] transition-all flex flex-col items-center gap-2">
              <svg *ngIf="!uploading" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <div *ngIf="uploading" class="animate-spin rounded-full h-6 w-6 border-b-2 border-[#0066FF]"></div>
              <span>{{ uploading ? 'Uploading...' : 'Click to upload an image' }}</span>
            </button>
          </div>
          <p class="text-xs text-slate-400 mt-1">{{ imageMode==='url' ? 'Paste a link to an image for the event banner' : 'JPG, PNG or WebP up to 5MB' }}</p>
        </div>

        <div *ngIf="eventForm.value.imageUrl" class="rounded-xl overflow-hidden border border-slate-200 h-40">
          <img [src]="eventForm.value.imageUrl" class="w-full h-full object-cover" alt="Preview">
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" [disabled]="saving || eventForm.invalid"
            class="bg-[#0066FF] text-white px-8 py-3 rounded-xl font-bold text-sm hover:bg-blue-600 transition-all disabled:opacity-50">
            {{ saving ? 'Saving...' : (isEditMode ? 'Update Event' : 'Create Event') }}
          </button>
          <button type="button" (click)="goBack()"
            class="bg-slate-100 text-slate-600 px-6 py-3 rounded-xl font-semibold text-sm hover:bg-slate-200">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
