<div class="py-10">
  <div class="container mx-auto px-4">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-bold text-slate-900">Clubs</h1>
        <p class="text-slate-500 mt-1">Discover communities or create your own</p>
      </div>
      <a routerLink="/student/clubs/create" class="bg-[#0066FF] text-white px-6 py-3 rounded-xl font-bold text-sm hover:bg-blue-600 transition-all no-underline inline-flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create Club
      </a>
    </div>

    <div class="flex gap-2 mb-6">
      <button (click)="switchTab('all')" [class]="activeTab === 'all' ? 'bg-[#0066FF] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" class="px-5 py-2 rounded-lg font-semibold text-sm transition-all">All Clubs</button>
      <button (click)="switchTab('my')" [class]="activeTab === 'my' ? 'bg-[#0066FF] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" class="px-5 py-2 rounded-lg font-semibold text-sm transition-all">My Clubs</button>
    </div>

    <div class="mb-8">
      <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="applySearch()" placeholder="Search clubs..." class="w-full max-w-md px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0066FF]/20 focus:border-[#0066FF]"/>
    </div>

    <div *ngIf="loading" class="flex justify-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-[#0066FF]"></div>
    </div>

    <div *ngIf="!loading && filteredClubs.length === 0" class="text-center py-20">
      <div class="text-6xl mb-4">🏫</div>
      <h3 class="text-xl font-bold text-slate-700 mb-2">No clubs found</h3>
      <p class="text-slate-500">Be the first to create a club!</p>
    </div>

    <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let club of filteredClubs" (click)="goToClub(club.id)" class="group cursor-pointer bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-lg hover:border-[#0066FF]/20 transition-all overflow-hidden">
        <div class="h-40 bg-gradient-to-br from-blue-500 to-indigo-600 relative overflow-hidden">
          <img *ngIf="club.imageUrl" [src]="club.imageUrl" class="w-full h-full object-cover" alt="">
          <div *ngIf="!club.imageUrl" class="w-full h-full flex items-center justify-center text-white/30 text-7xl font-black">{{ club.name?.charAt(0) }}</div>
          <div *ngIf="club.isPresident" class="absolute top-3 right-3 bg-yellow-400 text-yellow-900 text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full">President</div>
          <div *ngIf="club.membershipStatus === 'ACCEPTED'" class="absolute top-3 right-3 bg-green-400 text-green-900 text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full">Member</div>
          <div *ngIf="club.membershipStatus === 'PENDING'" class="absolute top-3 right-3 bg-orange-400 text-orange-900 text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full">Pending</div>
        </div>
        <div class="p-5">
          <h3 class="text-lg font-bold text-slate-900 mb-1 group-hover:text-[#0066FF] transition-colors">{{ club.name }}</h3>
          <p class="text-sm text-slate-500 mb-4 line-clamp-2">{{ club.description }}</p>
          <div class="flex items-center justify-between text-xs text-slate-400">
            <div class="flex items-center gap-3">
              <span class="flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                {{ club.memberCount }} members
              </span>
              <span class="flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                {{ club.eventCount }} events
              </span>
            </div>
            <span class="font-semibold text-slate-500">by {{ club.presidentName }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
