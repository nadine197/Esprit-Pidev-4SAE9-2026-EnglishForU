<div class="py-10">
  <div class="container mx-auto px-4 max-w-2xl">
    <a routerLink="/student/clubs" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-[#0066FF] mb-6 no-underline">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Clubs
    </a>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-8">
      <h1 class="text-2xl font-bold text-slate-900 mb-6">{{ isEditMode ? 'Edit Club' : 'Create a New Club' }}</h1>

      <div *ngIf="loading" class="flex justify-center py-10">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#0066FF]"></div>
      </div>

      <form *ngIf="!loading" [formGroup]="clubForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Club Name</label>
          <input formControlName="name" type="text" placeholder="Enter club name" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0066FF]/20 focus:border-[#0066FF]"/>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Description</label>
          <textarea formControlName="description" rows="5" placeholder="What is your club about?" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0066FF]/20 focus:border-[#0066FF] resize-none"></textarea>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Club Image (optional)</label>
          <div class="flex gap-2 mb-3">
            <button type="button" (click)="imageMode='url'" [class]="imageMode==='url' ? 'bg-[#0066FF] text-white' : 'bg-slate-100 text-slate-600'" class="px-4 py-2 rounded-lg text-xs font-semibold transition-all">Paste URL</button>
            <button type="button" (click)="imageMode='upload'" [class]="imageMode==='upload' ? 'bg-[#0066FF] text-white' : 'bg-slate-100 text-slate-600'" class="px-4 py-2 rounded-lg text-xs font-semibold transition-all">Upload Image</button>
          </div>

          <input *ngIf="imageMode==='url'" formControlName="imageUrl" type="text" placeholder="https://example.com/image.jpg" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#0066FF]/20 focus:border-[#0066FF]"/>

          <div *ngIf="imageMode==='upload'" class="relative">
            <input type="file" accept="image/*" (change)="onFileSelected($event)" class="hidden" #fileInput/>
            <button type="button" (click)="fileInput.click()" [disabled]="uploading" class="w-full px-4 py-6 rounded-xl border-2 border-dashed border-slate-300 hover:border-[#0066FF] text-sm text-slate-500 hover:text-[#0066FF] transition-all flex flex-col items-center gap-2">
              <svg *ngIf="!uploading" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <div *ngIf="uploading" class="animate-spin rounded-full h-6 w-6 border-b-2 border-[#0066FF]"></div>
              <span>{{ uploading ? 'Uploading...' : 'Click to upload an image' }}</span>
            </button>
          </div>

          <p class="text-xs text-slate-400 mt-1">{{ imageMode==='url' ? 'Paste a link to an image for your club banner' : 'JPG, PNG or WebP up to 5MB' }}</p>
        </div>

        <div *ngIf="clubForm.value.imageUrl" class="rounded-xl overflow-hidden border border-slate-200 h-40">
          <img [src]="clubForm.value.imageUrl" class="w-full h-full object-cover" alt="Preview">
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" [disabled]="saving || clubForm.invalid" class="bg-[#0066FF] text-white px-8 py-3 rounded-xl font-bold text-sm hover:bg-blue-600 transition-all disabled:opacity-50">
            {{ saving ? 'Saving...' : (isEditMode ? 'Update Club' : 'Create Club') }}
          </button>
          <a routerLink="/student/clubs" class="bg-slate-100 text-slate-600 px-6 py-3 rounded-xl font-semibold text-sm hover:bg-slate-200 no-underline">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
