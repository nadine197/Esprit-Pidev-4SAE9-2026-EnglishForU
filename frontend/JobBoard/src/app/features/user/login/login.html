<div class="flex min-h-screen items-center justify-center bg-[#f8fafc] px-4 py-12">
  <div class="w-full max-w-[420px]">

    <div class="mb-10 flex flex-col items-center justify-center gap-4">
      <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-[#0066FF] shadow-lg shadow-blue-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-[#1e293b]">LinguaAcademy</h1>
    </div>

    <div class="rounded-[32px] border border-slate-100 bg-white p-10 shadow-[0_20px_50px_rgba(0,0,0,0.06)]">

      <div class="mb-10 text-center">
        <h2 class="text-3xl font-bold text-[#1e293b] mb-2">Welcome back</h2>
        <p class="text-slate-500 font-medium">Sign in to your account to continue</p>
      </div>

      <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <div *ngIf="errorMessage" class="flex items-center gap-3 p-4 rounded-2xl bg-red-50 border border-red-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          <span class="text-sm font-medium text-red-700">{{ errorMessage }}</span>
        </div>

        <div class="space-y-2">
          <label class="text-sm font-bold text-slate-700 ml-1" for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            [ngClass]="{'border-red-500 bg-red-50': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
            class="flex h-13 w-full rounded-2xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#0066FF] focus:bg-white"
          />
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="ml-1">
            <p *ngIf="loginForm.get('email')?.errors?.['required']" class="text-xs font-medium text-red-500">Email is required</p>
            <p *ngIf="loginForm.get('email')?.errors?.['email']" class="text-xs font-medium text-red-500">Please enter a valid email address</p>
          </div>
        </div>

        <div class="space-y-2">
          <div class="flex items-center justify-between ml-1">
            <label class="text-sm font-bold text-slate-700" for="password">Password</label>
            <a routerLink="/forgot-password" class="text-xs font-bold text-[#0066FF] hover:underline">
              Forgot password?
            </a>
          </div>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            [ngClass]="{'border-red-500 bg-red-50': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
            class="flex h-13 w-full rounded-2xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-[#0066FF] focus:bg-white"
          />
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="ml-1">
            <p *ngIf="loginForm.get('password')?.errors?.['required']" class="text-xs font-medium text-red-500">Password is required</p>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full h-13 bg-[#0066FF] text-white rounded-2xl font-bold text-base hover:bg-[#0052cc] transition-all active:scale-[0.98] disabled:opacity-50 shadow-lg shadow-blue-500/25 mt-2">
          Sign In
        </button>
      </form>

      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center">
          <span class="w-full border-t border-slate-100"></span>
        </div>
        <div class="relative flex justify-center text-[10px] uppercase tracking-widest font-bold">
          <span class="bg-white px-4 text-slate-400">OR CONTINUE WITH</span>
        </div>
      </div>

      <button
        type="button"
        class="flex items-center justify-center w-full h-13 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 transition-all font-bold text-slate-700">
        <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4" />
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
        </svg>
        Continue with Google
      </button>

      <p class="mt-10 text-center text-sm text-slate-500 font-medium">
        Don't have an account?
        <a routerLink="/register" class="text-[#0066FF] hover:underline font-extrabold ml-1">Sign up</a>
      </p>
    </div>
  </div>
</div>
