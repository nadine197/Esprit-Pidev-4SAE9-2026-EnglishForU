<div class="relative">
  <button
    type="button"
    class="relative rounded-full border border-slate-200 bg-white p-2 text-slate-600 transition hover:border-blue-200 hover:text-[#0066FF]"
    (click)="toggleDropdown()"
    aria-label="Open notifications"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5" />
      <path d="M9 17a3 3 0 0 0 6 0" />
    </svg>
    <span *ngIf="unreadCount > 0" class="unread-badge absolute -right-1 -top-1 min-w-4 rounded-full bg-red-600 px-1 py-0.5 text-center text-[10px] font-bold text-white">
      {{ unreadCount }}
    </span>
  </button>

  <div *ngIf="dropdownOpen" class="notification-dropdown absolute right-0 top-full z-50 mt-3 w-80 rounded-2xl border border-slate-200 bg-white p-2 shadow-xl">
    <div class="mb-2 border-b border-slate-100 px-2 pb-2 text-sm font-black text-slate-800">Notifications</div>

    <div *ngIf="isLoading" class="px-2 py-4 text-sm text-slate-500">Loading...</div>

    <div *ngIf="!isLoading && notifications.length === 0" class="px-2 py-4 text-sm text-slate-500">
      You are all caught up.
    </div>

    <button
      *ngFor="let notification of notifications"
      type="button"
      (click)="openNotification(notification)"
      class="mb-2 w-full rounded-xl border p-3 text-left transition hover:bg-slate-50"
      [ngClass]="notification.read ? 'border-slate-200 bg-white' : 'border-blue-200 bg-blue-50'"
    >
      <div class="mb-1 flex items-start justify-between gap-3">
        <p class="text-sm font-semibold text-slate-800">{{ notification.title }}</p>
        <button
          *ngIf="!notification.read"
          type="button"
          class="text-[11px] font-bold uppercase tracking-wide text-[#0066FF]"
          (click)="markRead(notification, $event)"
        >
          Mark read
        </button>
      </div>
      <p class="text-xs text-slate-600">{{ notification.message }}</p>
      <time class="mt-2 block text-[11px] text-slate-400">{{ notification.createdAt | date: 'short' }}</time>
    </button>
  </div>

  <div *ngIf="toastMessage" class="absolute right-0 top-full z-[60] mt-3 rounded-lg bg-[#0066FF] px-3 py-2 text-xs font-semibold text-white shadow-lg">
    {{ toastMessage }}
  </div>
</div>
