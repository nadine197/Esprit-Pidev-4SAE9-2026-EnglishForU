<ng-container *ngIf="isHelpDesk">
  <div class="fixed right-6 top-4 z-50">
    <button type="button" class="relative rounded-full bg-white p-3 shadow-md ring-1 ring-slate-200" (click)="toggleDropdown()">
      🔔
      <span *ngIf="unreadCount > 0" class="absolute -right-1 -top-1 rounded-full bg-red-600 px-1.5 py-0.5 text-[10px] font-bold text-white">
        {{ unreadCount }}
      </span>
    </button>

    <div *ngIf="dropdownOpen" class="mt-2 w-96 rounded-xl border border-slate-200 bg-white p-2 shadow-xl">
      <div class="mb-2 border-b border-slate-100 px-2 pb-2 text-sm font-bold text-slate-700">Notifications</div>

      <div *ngIf="notifications.length === 0" class="px-2 py-4 text-sm text-slate-500">
        No notifications.
      </div>

      <button
        *ngFor="let notification of notifications"
        type="button"
        (click)="openNotification(notification)"
        class="mb-1 w-full rounded-lg border p-3 text-left hover:bg-slate-50"
        [ngClass]="notification.read ? 'border-slate-100 bg-white' : 'border-blue-200 bg-blue-50'"
      >
        <div class="mb-1 flex items-start justify-between gap-2">
          <p class="text-sm font-semibold text-slate-800">{{ notification.title }}</p>
          <button
            *ngIf="!notification.read"
            type="button"
            class="text-xs font-semibold text-[#0066FF]"
            (click)="markRead(notification, $event)"
          >
            Mark read
          </button>
        </div>
        <p class="text-xs text-slate-600">{{ notification.message }}</p>
      </button>
    </div>
  </div>

  <div *ngIf="toastMessage" class="fixed right-6 top-20 z-[60] rounded-lg bg-[#0066FF] px-4 py-2 text-sm font-semibold text-white shadow-lg">
    {{ toastMessage }}
  </div>
</ng-container>
