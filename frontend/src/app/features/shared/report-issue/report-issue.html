<button id="tour-report-issue" type="button" (click)="openModal()" class="report-fab">
  <span class="report-fab__icon">!</span>
  <span>Report Issue</span>
</button>

<div *ngIf="isOpen" class="report-overlay" (click)="closeModal()">
  <div id="tour-report-modal" class="report-modal" (click)="$event.stopPropagation()">
    <div class="report-header">
      <div>
        <p class="report-kicker">Quality Center</p>
        <h2>Report an issue</h2>
        <p>
          Help us improve EnglishForU by sharing the issue, impact, and reproduction details.
        </p>
      </div>
      <button type="button" class="report-close" (click)="closeModal()" [disabled]="isSubmitting">✕</button>
    </div>

    <form [formGroup]="reportForm" (ngSubmit)="submit()" class="report-form">
      <section class="report-section">
        <div class="report-label-row">
          <label class="report-label" for="report-title">Title *</label>
          <span class="report-counter">{{ getTitleLength() }}/180</span>
        </div>
        <input id="report-title" formControlName="title" class="report-input" placeholder="Short summary of the issue" />
        <p *ngIf="reportForm.get('title')?.touched && reportForm.get('title')?.invalid" class="report-error">
          Title is required.
        </p>
      </section>

      <section class="report-section report-grid-two">
        <div>
          <label class="report-label" for="report-category">Category *</label>
          <select id="report-category" formControlName="category" class="report-input">
            <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
          </select>
          <p class="report-hint">{{ getCategoryHint() }}</p>
        </div>

        <div>
          <label class="report-label" for="report-severity">Severity *</label>
          <select id="report-severity" formControlName="severity" class="report-input">
            <option *ngFor="let severity of severities" [value]="severity">{{ severity }}</option>
          </select>
          <p class="report-hint">{{ getSeverityHint() }}</p>
        </div>
      </section>

      <section class="report-section">
        <div class="report-label-row">
          <label class="report-label" for="report-description">Description *</label>
          <span class="report-counter">{{ getDescriptionLength() }}</span>
        </div>
        <textarea id="report-description" formControlName="description" rows="4" class="report-input report-textarea" placeholder="What happened? Include impact and when it started."></textarea>
        <p *ngIf="reportForm.get('description')?.touched && reportForm.get('description')?.invalid" class="report-error">
          Description is required.
        </p>
      </section>

      <section class="report-section">
        <label class="report-label" for="report-steps">Steps to reproduce</label>
        <textarea id="report-steps" formControlName="stepsToReproduce" rows="3" class="report-input report-textarea" placeholder="1. Open page ...&#10;2. Click ...&#10;3. Observe ..."></textarea>
      </section>

      <section class="report-section report-grid-two">
        <div>
          <label class="report-label" for="report-expected">Expected result</label>
          <textarea id="report-expected" formControlName="expectedResult" rows="3" class="report-input report-textarea" placeholder="What should have happened"></textarea>
        </div>
        <div>
          <label class="report-label" for="report-actual">Actual result</label>
          <textarea id="report-actual" formControlName="actualResult" rows="3" class="report-input report-textarea" placeholder="What happened instead"></textarea>
        </div>
      </section>

      <div class="report-footer">
        <button type="button" class="report-btn report-btn--ghost" (click)="closeModal()" [disabled]="isSubmitting">
          Cancel
        </button>
        <button id="tour-report-submit" type="submit" class="report-btn report-btn--primary" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Submitting...' : 'Submit Report' }}
        </button>
      </div>
    </form>
  </div>
</div>

<div *ngIf="toastMessage" class="report-toast" [ngClass]="toastType === 'success' ? 'report-toast--success' : 'report-toast--error'">
  {{ toastMessage }}
</div>
