<div *ngIf="isOpen"
     class="fixed bottom-24 right-6 w-[370px] h-[540px] bg-white shadow-2xl rounded-[30px] border border-slate-100 z-[9999] flex flex-col overflow-hidden">

  <div class="bg-gradient-to-r from-purple-700 to-indigo-600 p-5 text-white shrink-0 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center text-lg">🤖</div>
      <div>
        <div class="font-bold text-sm">LinguaBot</div>
        <div class="text-[10px] text-purple-200 font-medium">AI Assistant — Clubs & Events</div>
      </div>
    </div>
    <button (click)="clearChat()" class="text-[10px] bg-white/10 px-3 py-1 rounded-full hover:bg-white/20 transition-all font-bold">
      Clear
    </button>
  </div>

  <div #messagesContainer class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50"
       style="scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;">

    <div *ngIf="messages.length <= 1" class="mt-2">
      <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 px-1">Try asking</div>
      <div class="flex flex-wrap gap-1.5">
        <button *ngFor="let s of suggestions" (click)="sendMessage(s)"
                class="text-xs bg-white border border-purple-200 text-purple-700 px-3 py-1.5 rounded-full hover:bg-purple-50 hover:border-purple-400 transition-all font-medium">
          {{ s }}
        </button>
      </div>
    </div>

    <div *ngFor="let msg of messages" class="flex" [ngClass]="msg.role === 'user' ? 'justify-end' : 'justify-start'">
      <div *ngIf="msg.role === 'assistant'" class="w-7 h-7 bg-gradient-to-br from-purple-500 to-indigo-500 rounded-full flex items-center justify-center text-xs shrink-0 mr-2 mt-1">
        🤖
      </div>

      <div class="max-w-[75%] px-4 py-2.5 text-sm leading-relaxed"
           [ngClass]="msg.role === 'user'
             ? 'bg-[#0066FF] text-white rounded-[20px] rounded-br-lg'
             : 'bg-white text-slate-700 rounded-[20px] rounded-bl-lg shadow-sm border border-slate-100'"
           [innerHTML]="msg.content | formatAiMessage">
      </div>
    </div>

    <div *ngIf="isLoading" class="flex justify-start">
      <div class="w-7 h-7 bg-gradient-to-br from-purple-500 to-indigo-500 rounded-full flex items-center justify-center text-xs shrink-0 mr-2 mt-1">
        🤖
      </div>
      <div class="bg-white rounded-[20px] rounded-bl-lg shadow-sm border border-slate-100 px-4 py-3">
        <div class="flex gap-1">
          <span class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
          <span class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
          <span class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
        </div>
      </div>
    </div>

    <div *ngIf="error" class="text-center">
      <span class="text-xs text-red-500 bg-red-50 px-3 py-1 rounded-full">{{ error }}</span>
    </div>
  </div>

  <div class="p-3 border-t border-slate-100 bg-white shrink-0">
    <div class="flex items-center gap-2 bg-slate-50 rounded-2xl px-4 py-2 border border-slate-200 focus-within:border-purple-400 transition-colors">
      <input [(ngModel)]="userInput"
             (keydown)="onKeydown($event)"
             placeholder="Ask me anything..."
             class="flex-1 bg-transparent text-sm outline-none text-slate-700 placeholder-slate-400"
             [disabled]="isLoading" />
      <button (click)="sendMessage()"
              [disabled]="!userInput.trim() || isLoading"
              class="w-8 h-8 bg-gradient-to-br from-purple-600 to-indigo-600 text-white rounded-full flex items-center justify-center hover:scale-105 transition-all disabled:opacity-30 disabled:hover:scale-100 shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="text-center mt-1.5">
      <span class="text-[9px] text-slate-300 font-medium">Powered by AI</span>
    </div>
  </div>
</div>
