version: '3.8'

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: englishforu-postgres
    environment:
      POSTGRES_DB: GestionUserPI
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: inception722
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - englishforu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service Discovery
  eureka-server:
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    container_name: englishforu-eureka
    ports:
      - "8761:8761"
    networks:
      - englishforu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # User Management Service
  user-management:
    build:
      context: ./backend/user-management
      dockerfile: Dockerfile
    container_name: englishforu-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/GestionUserPI
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: inception722
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      SERVER_NAME: http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - englishforu-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: englishforu-frontend
    ports:
      - "4200:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - user-management
    networks:
      - englishforu-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  englishforu-network:
    driver: bridge
