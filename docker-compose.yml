version: "3.9"

x-eureka-only: &eureka-only
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"

x-service-env: &service-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

services:

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  eureka-server:
    image: ${REGISTRY:-local}/eureka-server:${TAG:-latest}
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  config-server:
    image: ${REGISTRY:-local}/config-server:${TAG:-latest}
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      <<: *eureka-only
      SPRING_PROFILES_ACTIVE: native,docker
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  gateway:
    image: ${REGISTRY:-local}/gateway:${TAG:-latest}
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/actuator/health -S 2>&1 | grep -E '(200|403)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  user-service:
    image: ${REGISTRY:-local}/user-service:${TAG:-latest}
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/GestionUserPI
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  appointment-service:
    image: ${REGISTRY:-local}/appointment-service:${TAG:-latest}
    container_name: appointment-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/GestionAppointPI
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  club-service:
    image: ${REGISTRY:-local}/club-service:${TAG:-latest}
    container_name: club-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ClubEventPI
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  course-service:
    image: ${REGISTRY:-local}/course-service:${TAG:-latest}
    container_name: course-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/CoursePI
      DB_URL: jdbc:postgresql://postgres:5432/CoursePI
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  discussion-service:
    image: ${REGISTRY:-local}/discussion-service:${TAG:-latest}
    container_name: discussion-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/DiscussionPI
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  package-service:
    image: ${REGISTRY:-local}/package-service:${TAG:-latest}
    container_name: package-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/GestionPackagePI
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  quiz-service:
    image: ${REGISTRY:-local}/quiz-service:${TAG:-latest}
    container_name: quiz-service
    restart: unless-stopped
    ports:
      - "8056:8056"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/QuizPI
      QUIZ_USER_SERVICE_URL: http://user-service:8081
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8056/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: ${REGISTRY:-local}/frontend:${TAG:-latest}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - sonar-db
    networks:
      - microservices-net
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs

  sonar-db:
    image: postgres:15-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    networks:
      - microservices-net
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

  prometheus:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.prometheus
    image: ${REGISTRY:-local}/prometheus:${TAG:-latest}
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - microservices-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
    name: microservices-net

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_logs:
  sonar_db_data:
  grafana_data:
  jenkins_home: