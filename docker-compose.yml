version: "3.9"

# ─────────────────────────────────────────────────────────────────
#  Shared environment fragments
#  NOTE: Docker Compose does NOT support <<: [*a, *b] multi-merge.
#  All common vars are combined into one anchor per use-case.
# ─────────────────────────────────────────────────────────────────

# Used by: config-server only (registers with eureka, does NOT import from config)
x-eureka-only: &eureka-only
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"

# Used by: gateway + all microservices (eureka + config-server + jvm flags)
x-service-env: &service-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"

# ─────────────────────────────────────────────────────────────────
#  Boot order: eureka → config-server → gateway → services → frontend
# ─────────────────────────────────────────────────────────────────
services:

  # ── 1. Eureka ────────────────────────────────────────────────
  eureka-server:
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/eureka-server:${TAG:-latest}
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── 2. Config Server ─────────────────────────────────────────
  config-server:
    build:
      context: ./backend/config-server
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/config-server:${TAG:-latest}
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      <<: *eureka-only
      SPRING_PROFILES_ACTIVE: native,docker
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── 3. API Gateway ───────────────────────────────────────────
  gateway:
    build:
      context: ./backend/Gateway
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/gateway:${TAG:-latest}
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/actuator/health -S 2>&1 | grep -E '(200|403)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── 4. User Service ──────────────────────────────────────────
  user-service:
    build:
      context: ./backend/user-management
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/user-service:${TAG:-latest}
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
      # SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db
      # SPRING_DATASOURCE_USERNAME: ${DB_USER}
      # SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── 5. Appointment Service ───────────────────────────────────
  appointment-service:
    build:
      context: ./backend/Appointment
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/appointment-service:${TAG:-latest}
    container_name: appointment-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── 6. Club Service ──────────────────────────────────────────
  club-service:
    build:
      context: ./backend/ClubEvent
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/club-service:${TAG:-latest}
    container_name: club-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── 7. Course Service ────────────────────────────────────────
  course-service:
    build:
      context: ./backend/course-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/course-service:${TAG:-latest}
    container_name: course-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── 8. Discussion Service ────────────────────────────────────
  discussion-service:
    build:
      context: ./backend/discussion-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/discussion-service:${TAG:-latest}
    container_name: discussion-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── 9. Package Service ───────────────────────────────────────
  package-service:
    build:
      context: ./backend/package_service
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/package-service:${TAG:-latest}
    container_name: package-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── 10. Quiz Service ─────────────────────────────────────────
  quiz-service:
    build:
      context: ./backend/Quiz
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/quiz-service:${TAG:-latest}
    container_name: quiz-service
    restart: unless-stopped
    ports:
      - "8056:8056"
    environment:
      <<: *service-env
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8056/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── 11. Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/frontend:${TAG:-latest}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # ── SonarQube ─────────────────────────────────────────────────
  sonarqube:
      image: sonarqube:community
      container_name: sonarqube
      restart: unless-stopped
      ports:
        - "9000:9000"
      environment:
        SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
        SONAR_JDBC_USERNAME: sonar
        SONAR_JDBC_PASSWORD: sonar
        SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"   # ← add this for Docker
      ulimits:
        nofile:
          soft: 65536
          hard: 65536
      depends_on:
        - sonar-db
      networks:
        - microservices-net
      volumes:
        - sonarqube_data:/opt/sonarqube/data
        - sonarqube_logs:/opt/sonarqube/logs

  sonar-db:
      image: postgres:15-alpine
      container_name: sonar-db
      restart: unless-stopped
      environment:
        POSTGRES_USER: sonar
        POSTGRES_PASSWORD: sonar
        POSTGRES_DB: sonar
      networks:
        - microservices-net
      volumes:
        - sonar_db_data:/var/lib/postgresql/data

    # ── Prometheus ────────────────────────────────────────────────
  prometheus:
      build:
        context: ./monitoring
        dockerfile: Dockerfile.prometheus
      image: ${REGISTRY:-local}/prometheus:${TAG:-latest}
      container_name: prometheus
      restart: unless-stopped
      ports:
        - "9090:9090"
      networks:
        - microservices-net

    # ── Grafana ───────────────────────────────────────────────────
  grafana:
      image: grafana/grafana:latest
      container_name: grafana
      restart: unless-stopped
      ports:
        - "3000:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin123
      volumes:
        - grafana_data:/var/lib/grafana
      depends_on:
        - prometheus
      networks:
        - microservices-net
# ─────────────────────────────────────────────────────────────────
#  Networks
# ─────────────────────────────────────────────────────────────────
networks:
  microservices-net:
    driver: bridge
    name: microservices-net
volumes:
  sonarqube_data:
  sonarqube_logs:
  sonar_db_data:
  grafana_data:
  jenkins_home:
