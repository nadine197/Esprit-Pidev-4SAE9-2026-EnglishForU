services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: inception722
      POSTGRES_DB: GestionUserPI
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  eureka:
    build: ./backEnd/eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    networks:
      - app-network
    restart: on-failure

  gateway:
    build: ./backEnd/Gateway
    ports:
      - "8090:8090"
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
    networks:
      - app-network
    restart: on-failure

  user-service:
    build: ./backEnd/microservices/User
    ports:
      - "8081:8081"
    depends_on:
      eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/GestionUserPI
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: inception722
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
    networks:
      - app-network
    restart: on-failure

  clubevent-service:
    build: ./backEnd/microservices/ClubEvent
    ports:
      - "8083:8083"
    depends_on:
      eureka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ./backEnd/microservices/ClubEvent/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ClubEventPI
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: inception722
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
    networks:
      - app-network
    restart: on-failure

  frontend:
    build: ./frontEnd/JobBoard
    ports:
      - "4200:80"
    depends_on:
      - gateway
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
