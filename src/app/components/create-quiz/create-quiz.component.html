<form [formGroup]="quizForm" (ngSubmit)="onSubmit()" novalidate>

  <!-- Titre -->
  <div class="form-group">
    <label>Titre du quiz *</label>
    <input formControlName="titre" type="text" placeholder="Ex: Quiz JavaScript avancé"
           [class.is-invalid]="titre.invalid && titre.touched">
    <div class="error" *ngIf="titre.invalid && titre.touched">
      {{ getErreur(titre) }}
    </div>
  </div>

  <!-- Description -->
  <div class="form-group">
    <label>Description *</label>
    <textarea formControlName="description" rows="3"
              [class.is-invalid]="description.invalid && description.touched"></textarea>
    <div class="error" *ngIf="description.invalid && description.touched">
      {{ getErreur(description) }}
    </div>
  </div>

  <!-- Catégorie -->
  <div class="form-group">
    <label>Catégorie *</label>
    <select formControlName="categorie"
            [class.is-invalid]="categorie.invalid && categorie.touched">
      <option value="">-- Choisir --</option>
      <option value="informatique">Informatique</option>
      <option value="mathematiques">Mathématiques</option>
      <option value="sciences">Sciences</option>
    </select>
    <div class="error" *ngIf="categorie.invalid && categorie.touched">
      {{ getErreur(categorie) }}
    </div>
  </div>

  <!-- Durée -->
  <div class="form-group">
    <label>Durée (minutes) *</label>
    <input formControlName="duree" type="number" min="1" max="180"
           [class.is-invalid]="duree.invalid && duree.touched">
    <div class="error" *ngIf="duree.invalid && duree.touched">
      {{ getErreur(duree) }}
    </div>
  </div>

  <!-- Questions dynamiques -->
  <div formArrayName="questions">
    <div *ngFor="let q of questions.controls; let i = index" [formGroupName]="i">
      <h4>Question {{ i + 1 }}</h4>

      <div class="form-group">
        <label>Énoncé *</label>
        <input formControlName="enonce" type="text"
               [class.is-invalid]="getQuestion(i).get('enonce')!.invalid && getQuestion(i).get('enonce')!.touched">
        <div class="error" *ngIf="getQuestion(i).get('enonce')!.invalid && getQuestion(i).get('enonce')!.touched">
          {{ getErreur(getQuestion(i).get('enonce')) }}
        </div>
      </div>

      <div class="form-group">
        <label>Choix A *</label>
        <input formControlName="choixA" type="text">
      </div>
      <div class="form-group">
        <label>Choix B *</label>
        <input formControlName="choixB" type="text">
      </div>
      <div class="form-group">
        <label>Choix C *</label>
        <input formControlName="choixC" type="text">
      </div>

      <div class="form-group">
        <label>Bonne réponse *</label>
        <select formControlName="bonneReponse">
          <option value="">-- Sélectionner --</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
        </select>
      </div>

      <button type="button" (click)="supprimerQuestion(i)" [disabled]="questions.length === 1">
        Supprimer cette question
      </button>
    </div>
  </div>

  <button type="button" (click)="ajouterQuestion()" [disabled]="questions.length >= 20">
    + Ajouter une question
  </button>

  <button type="submit" [disabled]="quizForm.invalid">
    Créer le quiz
  </button>

</form>
