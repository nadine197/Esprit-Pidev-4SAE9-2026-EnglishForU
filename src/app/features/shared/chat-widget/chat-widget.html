<!-- Bouton Flottant -->
<button (click)="toggleChat()" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-xl z-50">
  {{ isOpen ? '×' : '💬' }}
</button>

<!-- Fenêtre de Chat -->
<div *ngIf="isOpen" class="fixed bottom-24 right-6 w-72 h-96 bg-white shadow-2xl rounded-2xl border border-slate-200 z-50 flex flex-col overflow-hidden">
  <div class="bg-slate-900 p-4 text-white font-bold">My Discussions</div>
  
  <div class="flex-1 overflow-y-auto p-2">
    <!-- Changement de myGroups vers groups ici -->
    <div *ngFor="let g of groups" class="p-3 hover:bg-slate-50 rounded-xl cursor-pointer border-b border-slate-50 flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xs font-black">
        {{ g.groupName.substring(0,1).toUpperCase() }}
      </div>
      <span class="text-sm font-bold text-slate-700">{{ g.groupName }}</span>
    </div>
    
    <!-- Changement de myGroups vers groups ici -->
    <div *ngIf="groups.length === 0" class="text-center mt-10 text-slate-400 text-xs">
      No groups assigned yet.
    </div>
  </div>
</div>
