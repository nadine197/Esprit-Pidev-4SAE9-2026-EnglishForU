<div class="min-h-screen bg-slate-50 p-10">
  <div class="max-w-5xl mx-auto">

    <h1 class="text-3xl font-bold mb-8">Available Quizzes</h1>

    <div *ngFor="let quiz of quizzes" 
         class="bg-white p-6 rounded-2xl shadow mb-6 flex justify-between items-center">

      <div>
        <h2 class="text-xl font-bold">{{ quiz.title }}</h2>
        <p class="text-sm text-gray-500">
          Passing Score: {{ quiz.passingScore }}%
        </p>
      </div>

      <button 
        (click)="startQuiz(quiz.id)"
        class="bg-blue-600 text-white px-5 py-2 rounded-xl">
       Go
      </button>

    </div>

  </div>
</div>
