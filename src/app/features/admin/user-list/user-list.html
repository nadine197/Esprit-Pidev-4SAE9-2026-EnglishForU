<div class="space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-3xl font-black text-slate-900">User Management</h2>
      <p class="text-slate-500">Total members: {{users.length}}</p>
    </div>
    <button (click)="openAddModal()" class="bg-[#0066FF] text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-600 transition-all shadow-lg shadow-blue-500/20">
      + Add New User
    </button>
  </div>

  <!-- Table Card -->
  <div class="bg-white rounded-[32px] border border-slate-200 shadow-sm overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead class="bg-slate-50/50 text-slate-400 text-[10px] uppercase font-black tracking-widest">
        <tr>
          <th class="px-8 py-5">Full Name</th>
          <th class="px-8 py-5">Role</th>
          <th class="px-8 py-5">Status</th>
          <th class="px-8 py-5 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="text-sm">
        <tr *ngFor="let user of users" class="border-b border-slate-50 hover:bg-slate-50/50 transition-all">
          <td class="px-8 py-5 font-bold text-slate-900">{{user.name}} {{user.lastName}}</td>
          <td class="px-8 py-5"><span class="px-3 py-1 bg-blue-50 text-[#0066FF] rounded-full text-[10px] font-black">{{user.role}}</span></td>
          <td class="px-8 py-5 font-bold" [class.text-green-500]="user.active" [class.text-red-400]="!user.active">
            {{user.active ? '● Active' : '● Blocked'}}
          </td>
          <td class="px-8 py-5 text-right space-x-2">
            <button (click)="openEditModal(user)" class="text-slate-400 hover:text-blue-600">✏️</button>
            <button (click)="toggleBlock(user)" class="text-slate-400 hover:text-orange-500">🔒</button>
            <button (click)="deleteUser(user.id)" class="text-slate-400 hover:text-red-500">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- CRUD MODAL (Hidden by default) -->
  <div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
    <div class="bg-white rounded-[32px] w-full max-w-lg shadow-2xl p-10 animate-in fade-in zoom-in duration-200">
      <h3 class="text-2xl font-black text-slate-900 mb-2">{{isEditMode ? 'Update User' : 'Create New User'}}</h3>
      <p class="text-slate-500 mb-8">Enter account details below.</p>

      <form [formGroup]="userForm" (ngSubmit)="saveUser()" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <input formControlName="name" placeholder="First Name" class="h-12 border border-slate-200 rounded-xl px-4 text-sm outline-none focus:border-[#0066FF]">
          <input formControlName="lastName" placeholder="Last Name" class="h-12 border border-slate-200 rounded-xl px-4 text-sm outline-none focus:border-[#0066FF]">
        </div>
        <input formControlName="email" placeholder="Email Address" class="w-full h-12 border border-slate-200 rounded-xl px-4 text-sm outline-none focus:border-[#0066FF]">
        <input formControlName="phone" placeholder="Phone Number" class="w-full h-12 border border-slate-200 rounded-xl px-4 text-sm outline-none focus:border-[#0066FF]">
        
        <div *ngIf="!isEditMode">
          <input type="password" formControlName="password" placeholder="Set Password" class="w-full h-12 border border-slate-200 rounded-xl px-4 text-sm outline-none focus:border-[#0066FF]">
        </div>

        <select formControlName="role" class="w-full h-12 border border-slate-200 rounded-xl px-4 text-sm bg-white outline-none">
          <option value="STUDENT">Student</option>
          <option value="TUTOR">Teacher</option>
          <option value="ADMIN">Admin</option>
        </select>

        <div class="flex gap-3 pt-6">
          <button type="button" (click)="showModal = false" class="flex-1 h-12 border border-slate-200 rounded-xl font-bold text-slate-500">Cancel</button>
          <button type="submit" class="flex-1 h-12 bg-[#0066FF] text-white rounded-xl font-bold shadow-lg shadow-blue-500/20">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
