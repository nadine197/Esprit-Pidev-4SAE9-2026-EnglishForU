<div class="min-h-screen bg-slate-50 py-12 px-6">

  <!-- Loader -->
  <div *ngIf="loading" class="text-center text-lg font-semibold text-slate-600">
    Loading course...
  </div>

  <!-- Course Content -->
  <div *ngIf="!loading && course" class="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl p-10">

    <!-- Header -->
    <div class="flex flex-col md:flex-row gap-10">

      <!-- Image / Icon -->
      <div class="flex items-center justify-center bg-slate-100 rounded-2xl w-full md:w-1/3 h-60 text-7xl">
        📚
      </div>

      <!-- Info -->
      <div class="flex-1">

        <h1 class="text-4xl font-bold text-slate-900 mb-4">
          {{ course.title }}
        </h1>

        <div class="flex gap-6 mb-6 text-sm font-medium text-slate-600">
          <span class="bg-blue-100 text-blue-700 px-4 py-1 rounded-full">
            {{ course.duration }}
          </span>

          <span class="bg-green-100 text-green-700 px-4 py-1 rounded-full">
            English Course
          </span>
        </div>

        <p class="text-slate-600 leading-relaxed text-lg">
          {{ course.description }}
        </p>

        <!-- Buttons -->
        <div class="mt-8 flex gap-4">
<div class="mt-8 flex gap-4">

  <button  *ngIf="userRole === 'ADMIN' || userRole === 'TUTOR'"
   [routerLink]="addQuizLink"
    class="bg-[#0066FF] text-white px-6 py-3 rounded-xl font-bold text-sm hover:opacity-90 transition-all">
    Add Quiz
  </button>

<button 
  *ngIf="course"
  [routerLink]="viewQuizzesLink" 
  class="border border-slate-300 px-6 py-3 rounded-xl font-semibold text-sm hover:bg-slate-100 transition-all">
  View Quizzes
</button>

</div>

        </div>

      </div>
    </div>

    <!-- Extra Section -->
    <div class="mt-14 border-t pt-10">

      <h2 class="text-2xl font-bold text-slate-900 mb-6">
        What you'll learn
      </h2>

      <ul class="grid md:grid-cols-2 gap-4 text-slate-600">
        <li class="flex items-center gap-2">✔ Improve vocabulary</li>
        <li class="flex items-center gap-2">✔ Enhance speaking skills</li>
        <li class="flex items-center gap-2">✔ Practice listening</li>
        <li class="flex items-center gap-2">✔ Real-life conversations</li>
      </ul>

    </div>

  </div>

</div>
